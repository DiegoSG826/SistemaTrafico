name: Verificación SGT-CDMX
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: traffic
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: traffic_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U traffic -d traffic_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://traffic:ci-only-password@localhost:5432/traffic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pytest --cov=backend.app.controller --cov=backend.app.schemas --cov-branch --cov-fail-under=80 --cov-report=json:reports/coverage.json --junitxml=reports/tests.xml
      - run: python -m scripts.check_coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas
          path: reports/tests.xml
